<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="principles-title principles-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="principles-title">Strizh: четыре принципа</title>
  <desc id="principles-desc">Go runtime, Hare-like syntax, sum types and scoped parallelism.</desc>

  <rect x="0" y="0" width="800" height="400" rx="24" fill="#0f1115"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="23.5" fill="none" stroke="#262c36"/>

  <g transform="translate(40 30)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 22 L20 4" stroke="#e0a458" stroke-width="2.2"/>
    <path d="M20.2 3.8 L23 0.8 L21.6 5.8 Z" fill="#e0a458" stroke="none"/>
    <path d="M17 9 C14 9.2 12 10.6 10.5 13.2" stroke="#6fb3a8" stroke-width="1.7"/>
    <path d="M13.5 13.8 C11 14 9.3 15.4 8.1 17.8" stroke="#6fb3a8" stroke-width="1.7"/>
    <path d="M3 23.5 C9 25.5 16 25 22 21.5" stroke="#6fb3a8" stroke-width="1.5" opacity=".8"/>
  </g>

  <text x="78" y="49" fill="#e8e6e1" font-size="25" font-weight="700" letter-spacing="-0.4">Strizh</text>
  <text x="78" y="68" fill="#8b949e" font-size="12">язык приложений на Go runtime</text>
  <text x="760" y="49" text-anchor="end" fill="#8b949e" font-size="11.5" letter-spacing="2.2">4 ПРИНЦИПА</text>

  <line x1="40" y1="84" x2="760" y2="84" stroke="#262c36"/>

  <g>
    <rect x="40" y="106" width="350" height="120" rx="12" fill="#161b22" stroke="#262c36"/>
    <rect x="64" y="128" width="28" height="3" rx="1.5" fill="#e0a458"/>
    <text x="366" y="136" text-anchor="end" fill="#8b949e" font-size="12" letter-spacing="1">01</text>
    <text x="64" y="169" fill="#e8e6e1" font-size="21" font-weight="600">Go runtime</text>
    <text x="64" y="193" fill="#8b949e" font-size="13">Go-компилятор, stdlib и экосистема</text>
  </g>

  <g>
    <rect x="410" y="106" width="350" height="120" rx="12" fill="#161b22" stroke="#262c36"/>
    <rect x="434" y="128" width="28" height="3" rx="1.5" fill="#6fb3a8"/>
    <text x="736" y="136" text-anchor="end" fill="#8b949e" font-size="12" letter-spacing="1">02</text>
    <text x="434" y="169" fill="#e8e6e1" font-size="21" font-weight="600">Hare-like syntax</text>
    <text x="434" y="193" fill="#8b949e" font-size="13">Постфиксные типы, явный ;, без магии</text>
  </g>

  <g>
    <rect x="40" y="242" width="350" height="120" rx="12" fill="#161b22" stroke="#262c36"/>
    <rect x="64" y="264" width="28" height="3" rx="1.5" fill="#e0a458"/>
    <text x="366" y="272" text-anchor="end" fill="#8b949e" font-size="12" letter-spacing="1">03</text>
    <text x="64" y="305" fill="#e8e6e1" font-size="21" font-weight="600">Sum types</text>
    <text x="64" y="329" fill="#8b949e" font-size="13">enum и исчерпывающий match</text>
  </g>

  <g>
    <rect x="410" y="242" width="350" height="120" rx="12" fill="#161b22" stroke="#262c36"/>
    <rect x="434" y="264" width="28" height="3" rx="1.5" fill="#6fb3a8"/>
    <text x="736" y="272" text-anchor="end" fill="#8b949e" font-size="12" letter-spacing="1">04</text>
    <text x="434" y="305" fill="#e8e6e1" font-size="21" font-weight="600">Scoped parallelism</text>
    <text x="434" y="329" fill="#8b949e" font-size="13">par, par for, within. Без context</text>
  </g>

  <text x="760" y="386" text-anchor="end" fill="#8b949e" font-size="11" letter-spacing="1.4">0.2 PREVIEW</text>
